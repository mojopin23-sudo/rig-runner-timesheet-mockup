<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#F3011B"><title>Time Records — Job J-26-0157 | Tracker | Rig Runner</title><style>
:root{--red:#F3011B;--ink:#2A2A27;--red-dark:#c20016;--grey:#6b6b66;--line:#e2e2de;--bg:#f4f4f2;}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--red-dark)}
button{font-family:inherit}
/* ---------- top bar ---------- */
.topbar{background:#fff;border-bottom:4px solid var(--red);display:flex;align-items:center;gap:16px;padding:8px 24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink)}
.brand img{height:42px;width:auto;display:block}
.brand .divider{width:1px;height:32px;background:#d6d6d2}
.brand .appname{font-size:22px;font-weight:700;letter-spacing:.5px}
.nav{display:flex;gap:4px;margin-left:12px}
.nav a{padding:8px 14px;border-radius:6px;text-decoration:none;color:var(--grey);font-weight:600}
.nav a.active{background:var(--ink);color:#fff}
.nav a.disabled{opacity:.45;cursor:not-allowed}
.topbar .spacer{flex:1}
.demo-badge{background:#fff4d6;color:#7a5600;border:1px solid #f0d58a;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.user{display:flex;align-items:center;gap:8px;color:var(--grey);font-size:13px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
/* ---------- layout ---------- */
main{flex:1;width:100%;max-width:1320px;margin:0 auto;padding:22px 24px 40px}
footer.appfoot{text-align:center;color:var(--grey);font-size:12px;padding:14px;border-top:1px solid var(--line);background:#fff}
.page-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-head h1{font-size:22px;margin:0}
.page-head .sub{color:var(--grey);font-size:13px}
.page-head .spacer{flex:1}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid #cfcfca;background:#fff;color:var(--ink);padding:8px 14px;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:#f2f2ef}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:var(--red-dark)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.dark:hover{background:#000}
.btn.won{background:#1f8a4c;border-color:#1f8a4c;color:#fff}
.btn.lost{background:#fff;border-color:#b3261e;color:#b3261e}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* ---------- filters / table ---------- */
.filters{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;padding:14px 16px;border-bottom:1px solid var(--line)}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--grey);text-transform:uppercase;letter-spacing:.4px}
.filters select,.filters input{font-size:14px;padding:7px 10px;border:1px solid #cfcfca;border-radius:6px;min-width:160px;background:#fff;color:var(--ink)}
.filters .count{margin-left:auto;color:var(--grey);font-size:13px;align-self:center}
.table-wrap{overflow-x:auto}
table.grid{width:100%;border-collapse:collapse;font-size:13.5px}
table.grid th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--grey);background:#fafaf8;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.grid td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.grid tbody tr{cursor:pointer}
table.grid tbody tr:hover{background:#fff6f7}
table.grid td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.grid th.num{text-align:right}
.bidno{font-weight:700;color:var(--ink);white-space:nowrap}
.route{white-space:nowrap}
.route .arrow{color:var(--red);font-weight:700;margin:0 4px}
.info{display:inline-flex;width:15px;height:15px;border-radius:50%;background:#e4e4e0;color:#55554f;font-size:10px;align-items:center;justify-content:center;font-weight:700;cursor:help;margin-left:4px;text-transform:none}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.Draft{background:#ececea;color:#55554f}
.pill.Submitted{background:#e3eefc;color:#1b4f9c}
.pill.Won{background:#e0f4e7;color:#16713d}
.pill.Lost{background:#fde4e2;color:#a3221a}
.joblink{display:inline-block;margin-left:6px;font-size:12px;font-weight:700;color:#16713d;text-decoration:none;border-bottom:1px dashed #16713d}
.empty{padding:40px;text-align:center;color:var(--grey)}
/* ---------- form ---------- */
.form-card{padding:6px 22px 22px}
.section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--grey);border-bottom:1px solid var(--line);padding:16px 0 8px;margin:0 0 14px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 24px}
.fgrid .full{grid-column:1/-1}
.field label.lbl{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
.req{color:var(--red);margin-left:2px}
.field input[type=text],.field input[type=date],.field input[type=number],.field select,.field textarea{width:100%;font-size:14px;padding:8px 10px;border:1px solid #cfcfca;border-radius:6px;background:#fff;color:var(--ink);font-family:inherit}
.field textarea{min-height:70px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid rgba(243,1,27,.25);border-color:var(--red)}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:#d0021b;background:#fff7f7}
.err{color:#d0021b;font-size:12px;margin-top:4px;display:none;font-weight:600}
.field.invalid > .err{display:block}
.hint{color:var(--grey);font-size:12px;margin-top:4px}
.sentence{background:#fafaf8;border:1px dashed #d6d6d2;border-radius:6px;padding:9px 12px;font-size:13px;margin-top:8px}
.sentence b{color:var(--red-dark)}
.checks{display:flex;flex-wrap:wrap;gap:8px 22px}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:14px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--red)}
.equip-list{display:flex;flex-direction:column;gap:6px;max-width:560px}
.equip-row{display:flex;align-items:center;gap:10px;min-height:38px;flex-wrap:wrap}
.equip-row .chk{min-width:130px}
.equip-row .qty{flex:1;min-width:140px;max-width:320px}
.equip-row .qty input{width:100%;font-size:14px;padding:7px 9px;border:1px solid #cfcfca;border-radius:6px}
.equip-row.invalid .qty input{border-color:#d0021b;background:#fff7f7}
.equip-row .err{flex-basis:100%;margin:0 0 0 140px}
.equip-row.invalid .err{display:block}
.radios{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center}
.money{position:relative}
.money span{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--grey);font-weight:700}
.money input{padding-left:24px !important}
.form-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.form-actions .left{margin-right:auto;color:var(--grey);font-size:12px;align-self:center}
.banner{border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13.5px}
.banner.error{background:#fff1f1;border:1px solid #f3b4b4;color:#9b1111}
.banner.ok{background:#e9f7ee;border:1px solid #a9dbbb;color:#155d33}
.banner.note{background:#fff8e1;border:1px solid #f1d27a;color:#6b4d00}
.hidden{display:none !important}
/* ---------- searchable pick list (Rig, Operator) ---------- */
.combo{position:relative}
.combo .combo-input{padding-right:30px}
.combo .caret{position:absolute;right:10px;top:9px;color:var(--grey);font-size:11px;pointer-events:none}
.combo-list{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid #cfcfca;border-radius:7px;box-shadow:0 8px 22px rgba(0,0,0,.14);z-index:30;display:flex;flex-direction:column;overflow:hidden}
.combo-meta{padding:6px 10px;font-size:11px;color:var(--grey);text-transform:uppercase;letter-spacing:.4px;font-weight:700;background:#fafaf8;border-bottom:1px solid var(--line)}
.combo-opts{max-height:252px;overflow-y:auto}
.combo-opt{padding:7px 10px;font-size:14px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.combo-opt.active{background:#fff0f2}
.combo-opt.sel{font-weight:700}
.combo-opt.sel:after{content:"  \2713";color:var(--red-dark)}
.combo-opt mark{background:none;color:var(--red-dark);font-weight:700}
.combo-none{padding:9px 10px;color:var(--grey);font-style:italic;font-size:13px}
.combo-add{border-top:1px solid var(--line);color:var(--red-dark);font-weight:700;background:#fff}
.combo-add.active{background:#fff0f2}
/* ---------- job view ---------- */
.job-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 22px;border-bottom:1px solid var(--line)}
.job-head .check{width:44px;height:44px;border-radius:50%;background:#1f8a4c;color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;font-weight:700}
.job-head h2{margin:0;font-size:20px}
.job-head .jobno{font-size:26px;font-weight:800;color:var(--ink);letter-spacing:.5px}
.job-body{padding:18px 22px 22px}
table.map td.src{color:var(--grey);font-size:12.5px;white-space:nowrap}
table.map tbody tr{cursor:default}
table.map tbody tr:hover{background:transparent}
table.map td.f{font-weight:700;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#f1f1ee;border:1px solid #e0e0dc;border-radius:6px;padding:3px 8px;font-size:12.5px;font-weight:600}
.callout{border-left:5px solid var(--red);background:#fff4f5;padding:12px 16px;border-radius:6px;margin:0 0 16px;font-weight:700;color:#7d0010;display:flex;gap:10px;align-items:center}
/* ---------- toast ---------- */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;transition:all .25s;pointer-events:none;z-index:50;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---------- responsive ---------- */
@media (max-width:820px){
  .topbar{padding:8px 14px;gap:10px}
  .brand img{height:34px}
  .brand .appname{font-size:19px}
  .nav{margin-left:0}
  main{padding:16px 12px 30px}
  .fgrid{grid-template-columns:1fr}
  .filters select{min-width:130px}
  .filters .count{margin-left:0;flex-basis:100%}
  .user .uname{display:none}
}
/* ===================== Tracker UI mockup: extensions (same tokens as the bid mockup) ===================== */
:root{--t308:#e0700f;--t331:#1f8a4c;--t335:#1b4f9c;--t346:#7b3fa0}
.nav a{cursor:pointer}
.tsel{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--grey);text-transform:uppercase;letter-spacing:.4px}
.tsel select{font-size:14px;padding:7px 10px;border:1px solid #cfcfca;border-radius:6px;min-width:170px;background:#fff;color:var(--ink);font-weight:600;text-transform:none;letter-spacing:0}
.rolepill{display:inline-block;padding:2px 8px;border-radius:999px;background:#f1f1ee;border:1px solid #e0e0dc;color:var(--ink);font-size:11.5px;font-weight:700}
.user .who{display:flex;flex-direction:column;line-height:1.2}
.user .who b{color:var(--ink);font-size:13px}
.appfoot a{color:var(--grey)}
/* status pills for jobs (same .pill shape as bids) */
.pill.Scheduled{background:#e3eefc;color:#1b4f9c}
.pill.RigDown{background:#fff1d6;color:#8a5a00}
.pill.Transit{background:#ffe5e8;color:#b0001a}
.pill.RigUp{background:#ece6f7;color:#5b3a99}
.pill.Complete{background:#e0f4e7;color:#16713d}
.pill.Hold{background:#ececea;color:#55554f}
.pill.ok{background:#e0f4e7;color:#16713d}
.pill.warn{background:#fff1d6;color:#8a5a00}
.pill.bad{background:#fde4e2;color:#a3221a}
.pill.off{background:#ececea;color:#55554f}
.pill.info2{background:#e3eefc;color:#1b4f9c}
.tchip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:600}
.tchip i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.tnum{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:20px;padding:0 6px;border-radius:5px;color:#fff;font-size:11.5px;font-weight:800;letter-spacing:.3px}
/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{padding:14px 16px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line)}
.kpi.accent:before{background:var(--red)}
.kpi .k{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--grey)}
.kpi .v{font-size:30px;font-weight:800;margin-top:4px;letter-spacing:-.5px}
.kpi .s{font-size:12.5px;color:var(--grey);margin-top:2px}
/* layout grids */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.cols2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px}
.card-head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.card-head h3{margin:0;font-size:15px}
.card-head .sub{color:var(--grey);font-size:12.5px}
.card-head .spacer{flex:1}
.card-head a.more{font-size:13px;font-weight:700;text-decoration:none}
/* job cards */
.jcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:14px 16px 16px}
.jcard{border:1px solid var(--line);border-radius:9px;padding:12px 14px;cursor:pointer;background:#fff;border-left:5px solid var(--line)}
.jcard:hover{background:#fff6f7}
.jcard .top{display:flex;align-items:center;gap:8px}
.jcard .top .spacer{flex:1}
.jcard .rig{font-size:15px;font-weight:700;margin:6px 0 2px}
.jcard .meta{font-size:12.5px;color:var(--grey);display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.steps{display:flex;gap:3px;margin-top:10px}
.steps span{flex:1;height:6px;border-radius:3px;background:#e7e7e3}
.steps span.on{background:var(--ink)}
.steps span.cur{background:var(--red)}
.steplbl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--grey);margin-top:4px;text-transform:uppercase;letter-spacing:.3px;font-weight:700}
/* side lists */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);font-size:13px}
.list li:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0}
.list .t1{font-weight:700}
.list .t2{color:var(--grey);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
table.grid.compact td{padding:9px 12px}
.muted{color:var(--grey)}
.small{font-size:12px}
.mono{font-variant-numeric:tabular-nums}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 12px;background:#fff;border-radius:10px 10px 0 0}
.tabs a{padding:12px 14px;font-weight:700;color:var(--grey);text-decoration:none;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a.active{color:var(--ink);border-bottom-color:var(--red)}
.tabs a.disabled{opacity:.45;cursor:not-allowed}
/* job detail */
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--line)}
.fact{padding:13px 22px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.fact:nth-child(4n){border-right:0}
.fact .k{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--grey)}
.fact .v{font-size:15px;font-weight:700;margin-top:4px}
.routebox{display:flex;align-items:center;gap:18px;padding:18px 22px}
.routebox .end{flex:1;border:1px solid var(--line);border-radius:9px;padding:12px 14px;background:#fafaf8}
.routebox .end .k{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--grey)}
.routebox .end .v{font-size:16px;font-weight:700;margin-top:3px}
.routebox .end .d{font-size:12.5px;color:var(--grey);margin-top:3px}
.routebox .mid{text-align:center;min-width:150px}
.routebox .mid .mi{font-size:24px;font-weight:800}
.routebox .mid .line{height:3px;background:var(--red);border-radius:2px;margin:6px 0;position:relative}
.routebox .mid .line:after{content:"";position:absolute;right:-2px;top:-5px;border-left:10px solid var(--red);border-top:6.5px solid transparent;border-bottom:6.5px solid transparent}
.timeline{display:flex;padding:16px 22px 18px;gap:0}
.tl{flex:1;text-align:center;position:relative}
.tl:before{content:"";position:absolute;top:13px;left:-50%;right:50%;height:3px;background:#e2e2de;z-index:0}
.tl:first-child:before{display:none}
.tl.done:before,.tl.cur:before{background:var(--ink)}
.tl .dot{width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid #d6d6d2;margin:0 auto;position:relative;z-index:1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff}
.tl.done .dot{background:var(--ink);border-color:var(--ink)}
.tl.cur .dot{background:var(--red);border-color:var(--red);box-shadow:0 0 0 4px rgba(243,1,27,.18)}
.tl .n{font-size:12.5px;font-weight:700;margin-top:7px}
.tl .w{font-size:11.5px;color:var(--grey);margin-top:2px}
.reqgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.req-t{border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.req-t .k{font-size:11.5px;font-weight:700;color:var(--grey);text-transform:uppercase;letter-spacing:.4px}
.req-t .v{font-size:18px;font-weight:800;margin-top:2px}
.req-t .bar{height:5px;border-radius:3px;background:#ececea;margin-top:7px;overflow:hidden}
.req-t .bar i{display:block;height:100%;background:#1f8a4c}
.req-t.short .bar i{background:#e0a100}
.req-t.short .v{color:#8a5a00}
.unit{display:inline-flex;align-items:center;gap:6px;border:1px solid #e0e0dc;background:#f1f1ee;border-radius:6px;padding:3px 8px;font-size:12.5px;font-weight:700;white-space:nowrap}
.unit small{font-weight:600;color:var(--grey)}
.link-ic{color:var(--red);font-weight:800;margin:0 4px}
.unassigned{color:var(--grey);font-style:italic;font-size:12.5px}
.feed{list-style:none;margin:0;padding:6px 0}
.feed li{display:flex;gap:12px;padding:10px 16px;font-size:13px}
.feed .tm{color:var(--grey);font-size:12px;min-width:62px;font-weight:700;padding-top:1px}
.feed .src{font-size:11px;font-weight:700;color:var(--grey);text-transform:uppercase;letter-spacing:.4px}
.kv{width:100%;border-collapse:collapse;font-size:13.5px}
.kv td{padding:9px 16px;border-bottom:1px solid var(--line)}
.kv tr:last-child td{border-bottom:0}
.kv td.k{color:var(--grey);font-weight:700;width:42%}
.access{display:inline-flex;gap:5px;flex-wrap:wrap}
.acc{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;border:1px solid transparent}
.acc.aph{background:#e0f4e7;color:#16713d}
.acc.web{background:var(--ink);color:#fff}
.acc.ro{background:#fff;color:var(--ink);border-color:#cfcfca}
.acc.none{background:#ececea;color:#55554f}
.acc.pend{background:#fff1d6;color:#8a5a00}
.acc svg{width:12px;height:12px}
.pname{font-weight:700}
.pname small{display:block;color:var(--grey);font-weight:600;font-size:12px}
/* calendar */
.calbar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.calbar h2{margin:0;font-size:20px;min-width:170px;text-align:center}
.legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:13px;font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:7px}
.cal-dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:#fafaf8;border-bottom:1px solid var(--line)}
.cal-dow div{padding:8px 10px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--grey)}
.cal-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:min-content;position:relative;min-height:128px;border-bottom:1px solid var(--line);padding-bottom:8px;grid-auto-flow:row dense}
.cal-week:last-child{border-bottom:0}
.cal-bg{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));pointer-events:none}
.cal-bg div{border-right:1px solid var(--line)}
.cal-bg div:last-child{border-right:0}
.cal-bg div.we{background:#fbfbf9}
.cal-bg div.out{background:#f6f6f3}
.cal-bg div.today{background:#fff4f5;box-shadow:inset 0 3px 0 var(--red)}
.cal-day{grid-row:1;padding:7px 10px 4px;font-size:13px;font-weight:700;position:relative;z-index:1}
.cal-day.out{color:#b5b5ae}
.cal-day.today span{background:var(--red);color:#fff;border-radius:999px;padding:1px 7px}
.cal-ev{position:relative;z-index:1;margin:2px 5px;border-radius:5px;color:#fff;font-size:12px;font-weight:700;padding:4px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;box-shadow:0 1px 1px rgba(0,0,0,.12)}
.cal-ev small{font-weight:600;opacity:.9}
.cal-ev.hold{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.22) 0 6px,transparent 6px 12px)}
/* ---------- index ---------- */
.seg{display:inline-flex;border:1px solid #cfcfca;border-radius:8px;overflow:hidden;background:#fff}
.seg a{padding:8px 18px;font-weight:700;color:var(--grey);text-decoration:none;cursor:pointer}
.seg a.active{background:var(--ink);color:#fff}
.idx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;padding:16px}
.idx{display:block;border:1px solid var(--line);border-radius:9px;padding:14px 16px;text-decoration:none;color:var(--ink);border-top:4px solid var(--ink)}
.idx:hover{background:#fff6f7;border-top-color:var(--red)}
.idx .no{font-size:11.5px;font-weight:700;color:var(--grey);text-transform:uppercase;letter-spacing:.5px}
.idx .nm{font-size:16px;font-weight:700;margin:4px 0}
.idx .ds{font-size:13px;color:var(--grey);line-height:1.4}

/* ===================== PHONE (phone web app, 390 x 844) ===================== */
body.phone-mode{background:#d7d7d2}
body.phone-mode .topbar,body.phone-mode .appfoot{display:none}
body.phone-mode main{max-width:none;padding:0}
.stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;gap:10px}
.stage .back-idx{font-size:12.5px;font-weight:700;color:var(--ink);text-decoration:none;background:#fff;border:1px solid #cfcfca;border-radius:999px;padding:5px 12px}
body.shot .stage .back-idx{display:none}
.phone{width:414px;height:868px;border:12px solid #151514;border-radius:52px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.28);position:relative}
.sbar{height:34px;flex:none;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 30px;font-size:14px;font-weight:700;color:#000}

.sbar .batt{width:24px;height:11px;border:1.5px solid #000;border-radius:3px;position:relative;padding:1px}

.ptop{flex:none;background:#fff;border-bottom:4px solid var(--red);display:flex;align-items:center;gap:10px;padding:8px 14px;min-height:56px}

.ptop .brand .appname{font-size:18px}
.ptop .spacer{flex:1}
.ptop .pback{width:34px;height:34px;border-radius:8px;border:1px solid #cfcfca;background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--ink);text-decoration:none;cursor:pointer}
.ptop .ptitle{font-size:17px;font-weight:700}
.ptop .avatar{width:32px;height:32px}
.gps{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:#16713d;background:#e0f4e7;border-radius:999px;padding:3px 9px}
.gps i{width:7px;height:7px;border-radius:50%;background:#1f8a4c;display:inline-block}
.gps.off{color:#a3221a;background:#fde4e2}
.gps.off i{background:#a3221a}
.pbody{flex:1;min-height:0;overflow-y:auto;padding:14px 14px 18px;display:flex;flex-direction:column;gap:12px}
.pfoot{flex:none;background:#fff;border-top:1px solid var(--line);padding:12px 14px 22px;display:flex;gap:10px}
.pfoot .btn{flex:1;justify-content:center;padding:13px 14px;font-size:16px;border-radius:9px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.04);padding:13px 14px}
.pcard.hl{border-left:5px solid var(--red)}
.ph-h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--grey);margin:4px 2px -4px}
.pfield label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.pfield input,.pfield select,.pfield textarea{width:100%;font-size:17px;padding:12px 12px;border:1px solid #cfcfca;border-radius:9px;background:#fff;color:var(--ink);font-family:inherit}
.pfield textarea{min-height:64px;font-size:15px}
.pfield input:focus{outline:2px solid rgba(243,1,27,.25);border-color:var(--red)}
.pin{display:flex;gap:10px}
.pin span{flex:1;height:54px;border:1px solid #cfcfca;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--ink)}
.pin span.f{border-color:var(--ink)}
.pin span.c{border-color:var(--red);box-shadow:0 0 0 3px rgba(243,1,27,.15)}
.bigbtn{display:flex;width:100%;justify-content:center;padding:15px;font-size:17px;border-radius:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 14px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:10px;min-height:150px;box-shadow:0 1px 2px rgba(0,0,0,.04);cursor:pointer}
.tile .ico{width:46px;height:46px;border-radius:12px;background:var(--ink);display:flex;align-items:center;justify-content:center}
.tile.red .ico{background:var(--red)}
.tile .ico svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile .nm{font-size:17px;font-weight:700}
.tile .ds{font-size:12.5px;color:var(--grey);margin-top:-6px;line-height:1.35}
.tile .badge{align-self:flex-start;font-size:11.5px}
.row{display:flex;align-items:center;gap:8px}
.row .spacer{flex:1}
.prt{font-size:16px;font-weight:700;margin:6px 0 2px}
.pmeta{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13.5px;margin-top:9px}
.pmeta .k{color:var(--grey);font-weight:700;font-size:12.5px}
.clock{text-align:center;padding:18px 14px}
.clock .st{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#16713d}
.clock .big{font-size:46px;font-weight:800;letter-spacing:-1px;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.clock .since{color:var(--grey);font-size:13.5px}
.hrs{width:100%;border-collapse:collapse;font-size:14px}
.hrs td{padding:9px 2px;border-bottom:1px solid var(--line)}
.hrs tr:last-child td{border-bottom:0}
.hrs td.n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;border:1px solid #cfcfca;border-radius:10px;padding:12px 13px;background:#fff;font-size:15px;font-weight:700}

.opt.sel{border-color:var(--red);box-shadow:0 0 0 3px rgba(243,1,27,.13)}

.opt small{display:block;font-weight:600;color:var(--grey);font-size:12px}
.opt .tm{margin-left:auto;font-size:12px;color:var(--grey);font-weight:700}
.chkrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.chkrow:last-child{border-bottom:0}
.chkrow .lb{flex:1;font-weight:600}
.okdef{display:flex;border:1px solid #cfcfca;border-radius:8px;overflow:hidden}
.okdef span{padding:6px 11px;font-size:13px;font-weight:700;color:var(--grey);background:#fff}

.okdef span.ok{background:#1f8a4c;color:#fff}
.okdef span.def{background:#b3261e;color:#fff}
.defnote{background:#fff7f7;border:1px solid #f3b4b4;border-radius:8px;padding:9px 11px;font-size:13px;color:#9b1111;margin:-2px 0 6px}
.gate{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px 24px;gap:14px}

.locked{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.locked span{font-size:12px;font-weight:700;color:#9a9a94;border:1px dashed #cfcfca;border-radius:999px;padding:4px 10px}
.signin-hero{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 0 6px}
.signin-hero img{width:190px}
.signin-hero .appname{font-size:26px;font-weight:700;letter-spacing:.5px}
.signin-hero .s{color:var(--grey);font-size:14px}
@media (max-width:440px){
  .stage{padding:0;justify-content:flex-start}
  .stage .back-idx{display:none}
  .phone{width:100%;height:100vh;height:100dvh;border:0;border-radius:0;box-shadow:none}
  .sbar{display:none}
}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function mins(t){var p=t.split(':');return +p[0]*60+ +p[1]}
function t12(t){var m=mins(t),h=Math.floor(m/60);return ((h%12)||12)+':'+String(m%60).padStart(2,'0')+' '+(h<12?'AM':'PM')}
function loc(r){return Math.max(0,(mins(r.cout)-mins(r.cin))/60-(r.lunch?.5:0))}
function tot(r){return loc(r)+(+r.tTo||0)+(+r.tFrom||0)}
function h2(n){return (Math.round(n*100)/100).toFixed(2)}
function now(){return new Date().toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
function toast(t){var e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('show')},2200)}
function tchip(t){return t?'<span class="tchip"><i style="background:'+TC[t.slice(0,3)]+'"></i>'+t+'</span>':''}
function pill(s){return '<span class="pill '+({'Pending approval':'warn','Approved':'ok','Mileage due':'bad','Correction requested':'info2'}[s])+'">'+s+'</span>'}
function vis(){return R.filter(function(r){return (F.pos==='All'||r.pos===F.pos)&&(F.per==='All'||r.name===F.per)&&(F.term==='All'||r.term===F.term)&&(F.st==='All'||r.status===F.st)})}
function opt(id,lbl,list,v){return '<label>'+lbl+'<select id="'+id+'"><option value="All">'+(id==='fT'?'View All':'All')+'</option>'+list.map(function(x){return '<option'+(x===v?' selected':'')+'>'+esc(x)+'</option>'}).join('')+'</select></label>'}
function uniq(k){return R.map(function(r){return r[k]}).filter(function(v,i,a){return a.indexOf(v)===i})}
function log(r,what,a,b){LOG.unshift({who:'D. McNeel ('+ROLE+')',when:now(),txt:(r?'<b>'+esc(r.name)+'</b> · ':'')+what,a:a,b:b});$('#logn').textContent=LOG.length;drawLog();}
function drawLog(){$('#logbd').innerHTML=LOG.length?LOG.map(function(l){return '<div class="logi"><div>'+l.txt+(l.a!==undefined?': <span style="text-decoration:line-through;color:#999">'+esc(l.a)+'</span> → <b>'+esc(l.b)+'</b>':'')+'</div><div class="w">'+l.who+' · '+l.when+'</div></div>'}).join(''):'<div class="muted">No changes yet. Edits to travel time, per diem and approvals are logged here.</div>'}
function render(){
 var rows=vis(),lk=function(){return LOCK};
 var body=rows.map(function(r){var ap=r.status==='Approved';
  return '<tr data-id="'+r.id+'"><td><b>'+esc(r.name)+'</b><div class="small muted">'+r.pos+'</div></td><td>'+tchip(r.term)+'</td>'+
  '<td>'+(r.eq?esc(r.eq)+(r.pv?'<div class="small muted">leased personal vehicle</div>':'')+'<div class="small">'+tchip(r.eqT)+'</div>':'<span class="muted">—</span>')+'</td>'+
  '<td>'+t12(r.cin)+lk()+'</td><td>'+t12(r.cout)+lk()+'</td><td class="num">'+h2(loc(r))+'</td>'+
  '<td class="num'+(r.ed.tTo?' edited':'')+'"><input class="tin" data-f="tTo" type="number" step="0.25" min="0" value="'+r.tTo+'"'+(ap?' disabled':'')+'></td>'+
  '<td class="num'+(r.ed.tFrom?' edited':'')+'"><input class="tin" data-f="tFrom" type="number" step="0.25" min="0" value="'+r.tFrom+'"'+(ap?' disabled':'')+'></td>'+
  '<td class="num"><b>'+h2(tot(r))+'</b></td>'+
  '<td'+(r.ed.pd?' class="edited"':'')+'><span class="pdt" data-pd="'+r.id+'"><span class="'+(r.pd==='Yes'?'on':'')+'">Yes</span><span class="'+(r.pd==='No'?'on':'')+'">No</span></span><div class="req-note">req: '+r.pdReq+'</div></td>'+
  (r.pv?'<td class="num">'+r.sMi.toLocaleString()+'</td><td class="num">'+(r.eMi?r.eMi.toLocaleString():'<span class="pill bad">due</span>')+'</td><td class="num">'+(r.eMi?r.eMi-r.sMi:'—')+'</td>':'<td class="num muted">—</td><td class="num muted">—</td><td class="num muted">—</td>')+
  '<td>'+(r.exc?'<span class="pill '+(r.exc==='Correction'?'info2':'warn')+'">'+r.exc+'</span>':'<span class="muted">—</span>')+'</td>'+
  '<td class="mimo"><span class="'+(r.mi?'ok':'no')+'">MI '+(r.mi?'✓':'✕')+'</span><br><span class="'+(r.mo?'ok':'no')+'">MO '+(r.mo?'✓':'✕')+'</span></td>'+
  '<td>'+pill(r.status)+'</td><td class="by">'+(r.by?'Approved by '+esc(r.by).replace(' · ','<br>'):'<span class="muted">—</span>')+'</td>'+
  '<td><input type="checkbox" data-sel="'+r.id+'"'+(r.sel?' checked':'')+(ap?' disabled':'')+'></td></tr>'}).join('');
 var sl=rows.reduce(function(a,r){return a+loc(r)},0),sw=rows.reduce(function(a,r){return a+tot(r)},0),mi=rows.reduce(function(a,r){return a+(r.pv&&r.eMi?r.eMi-r.sMi:0)},0);
 var cb={};TERMS.forEach(function(t){cb[t]={p:0,e:0,n:0,m:0}});
 rows.forEach(function(r){cb[r.term].p+=tot(r);cb[r.term].n++;if(r.eq&&!r.pv)cb[r.eqT].e+=loc(r);if(r.eq&&!r.pv)cb[r.eqT].m++;});
 var pend=R.filter(function(r){return r.exc==='Correction'});
 $('#app').innerHTML='<div class="page-head"><h1>Time Records — Job J-26-0157</h1><span class="sub">Patterson-UTI #318 · job terminal '+tchip('308 Alice')+' · Mon, Oct 12, 2026</span><span class="spacer"></span>'+
  '<button class="btn" id="logbtn">Change log (<span id="logn">'+LOG.length+'</span>)</button><button class="btn" id="export">Export to Excel</button><button class="btn dark" id="travel">Submit Travel Time</button><button class="btn primary" id="approve">Approve selected</button></div>'+
  (travelSubmitted?'<div class="banner note" style="margin:0 0 12px">Travel time submitted by '+travelSubmitted+'.</div>':'')+
  '<div class="card"><div class="filters">'+opt('fP','Position',uniq('pos'),F.pos)+opt('fN','Personnel',uniq('name'),F.per)+opt('fT','Terminal',TERMS,F.term)+opt('fS','Status',['Pending approval','Approved','Mileage due','Correction requested'],F.st)+
  '<span class="count">'+rows.length+' of '+R.length+' records · clock in/out locked '+LOCK+' · travel &amp; per diem editable</span></div>'+
  '<div class="table-wrap"><table class="grid tr"><thead><tr><th>Resource</th><th>Home Terminal</th><th>Linked Equipment</th><th>Clock In</th><th>Clock Out</th><th class="num">Hrs on Location</th><th class="num">Travel To</th><th class="num">Travel From</th><th class="num">Total Hrs</th><th>Per Diem</th><th class="num">Start Mi</th><th class="num">End Mi</th><th class="num">Miles</th><th>Exc</th><th>MI/MO</th><th>Status</th><th>Approved By / When</th><th><input type="checkbox" id="selall" title="Select all"></th></tr></thead><tbody>'+body+'</tbody>'+
  '<tfoot><tr class="foot"><td colspan="5">Totals ('+rows.length+')</td><td class="num">'+h2(sl)+'</td><td colspan="2" class="num">+'+h2(sw-sl)+' travel</td><td class="num">'+h2(sw)+'</td><td></td><td colspan="2"></td><td class="num">'+mi+'</td><td colspan="5"></td></tr></tfoot></table></div>'+
  '<div class="kv"><div>Hours without travel<b id="hNo">'+h2(sl)+'</b></div><div>Hours with travel<b id="hYes">'+h2(sw)+'</b></div><div>Leased-vehicle miles<b>'+mi+'</b></div><div>Per Diem approved<b>'+rows.filter(function(r){return r.pd==='Yes'}).length+'</b></div></div></div>'+
  '<div class="side"><div class="card"><div class="card-head"><h3>Cost by terminal</h3><span class="sub">Hours only · rates pending</span><span class="spacer"></span><span class="pill off">Rates pending</span></div><table class="cbt"><thead><tr><th>Home terminal</th><th>People</th><th>Personnel hrs (incl. travel)</th><th>Units</th><th>Equipment hrs</th></tr></thead><tbody>'+
  TERMS.map(function(t){var c=cb[t];return '<tr><td>'+tchip(t)+'</td><td>'+c.n+'</td><td>'+h2(c.p)+'</td><td>'+c.m+'</td><td>'+h2(c.e)+'</td></tr>'}).join('')+'</tbody></table><div class="small muted" style="padding:8px 16px">Equipment hours follow the linked operator’s clock in/out; leased personal vehicles are paid by mileage, not hours. Dollar rates will be added when finalized.</div></div>'+
  '<div class="card"><div class="card-head"><h3>Correction requests</h3><span class="sub">Routed to Admin</span><span class="spacer"></span><span class="pill warn">'+pend.length+' pending</span></div>'+
  pend.map(function(r){return '<div class="corr"><b>'+esc(r.name)+'</b> · '+r.pos+' · Oct 12<br>Recorded out '+t12(r.cout)+' '+LOCK+' → requested <b>6:15 PM</b><br><span class="muted">“Stayed to help set the sub; app froze before I could clock out.”</span><div class="row" style="margin-top:8px"><span class="pill info2">Pending Admin review</span><span class="spacer"></span><span class="small muted">Submitted Oct 12, 6:40 PM</span></div></div>'}).join('')+'</div></div>';
 wire();}
function wire(){
 [['fP','pos'],['fN','per'],['fT','term'],['fS','st']].forEach(function(a){$('#'+a[0]).onchange=function(e){F[a[1]]=e.target.value;render()}});
 $$('.tin').forEach(function(i){i.onchange=function(){var r=R[+i.closest('tr').dataset.id],f=i.dataset.f,v=Math.max(0,parseFloat(i.value)||0),old=r[f];if(v===old)return;r[f]=v;r.ed[f]=r.orig[f]!==v;log(r,f==='tTo'?'Travel To (hrs)':'Travel From (hrs)',old,v);render();}});
 $$('[data-pd]').forEach(function(p){p.onclick=function(){var r=R[+p.dataset.pd];if(r.status==='Approved')return toast('Approved records are locked');var old=r.pd;r.pd=old==='Yes'?'No':'Yes';r.ed.pd=r.pd!==r.orig.pd;log(r,'Per Diem (requested '+r.pdReq+')',old,r.pd);render();}});
 $$('[data-sel]').forEach(function(c){c.onchange=function(){R[+c.dataset.sel].sel=c.checked}});
 $('#selall').onchange=function(e){vis().forEach(function(r){if(r.status!=='Approved')r.sel=e.target.checked});render();$('#selall').checked=e.target.checked};
 $('#approve').onclick=function(){var s=R.filter(function(r){return r.sel});if(!s.length)return toast('Select at least one record');var ok=0,skip=[];
  s.forEach(function(r){if(r.status==='Mileage due'){skip.push(r.name);return;}r.status='Approved';r.by='D. McNeel ('+ROLE+') · '+now();r.sel=false;ok++;log(r,'Status','Pending approval','Approved');});
  render();toast(ok+' approved'+(skip.length?' · skipped '+skip.join(', ')+' (mileage due)':''));};
 $('#travel').onclick=function(){travelSubmitted='D. McNeel ('+ROLE+') · '+now();log(null,'Travel time submitted for '+R.length+' records');render();toast('Travel time submitted');};
 $('#export').onclick=function(){var h=['Resource','Position','Home Terminal','Linked Equipment','Equip Terminal','Clock In','Clock Out','Hrs on Location','Travel To','Travel From','Total Hrs','Per Diem','Start Mi','End Mi','Miles','Exc','Status','Approved By'];
  var L=[h].concat(vis().map(function(r){return [r.name,r.pos,r.term,r.eq,r.eqT,t12(r.cin),t12(r.cout),h2(loc(r)),r.tTo,r.tFrom,h2(tot(r)),r.pd,r.pv?r.sMi:'',r.pv&&r.eMi?r.eMi:'',r.pv&&r.eMi?r.eMi-r.sMi:'',r.exc,r.status,r.by]}));
  var csv=L.map(function(a){return a.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='Time-Records-J-26-0157.csv';document.body.appendChild(a);a.click();a.remove();toast('Exported '+(L.length-1)+' rows (opens in Excel)');};
 $('#logbtn').onclick=function(){drawLog();$('#drawer').classList.add('open')};
}
$('#dclose').onclick=function(){$('#drawer').classList.remove('open')};
$$('#vas a').forEach(function(a){a.onclick=function(){ROLE=a.dataset.v;$$('#vas a').forEach(function(x){x.classList.toggle('active',x===a)});$('#rolep').textContent=ROLE;toast('Viewing as '+ROLE+' · both can approve')}});
render();drawLog();
})();
</script></body></html>
